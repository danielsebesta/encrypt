name: Node and Docker build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ATTEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:node
      - name: Smoke test the Node server
        run: |
          DATA_DIR="$RUNNER_TEMP/data" PORT=8080 node dist/node/server.mjs &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          node scripts/smoke-node.mjs http://127.0.0.1:8080
      - name: Build the image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: docker build --build-arg COMMIT_SHA="$COMMIT_SHA" --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -t encrypt-click:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name encrypt -p 8081:8080 -p 3478:3478/udp -e PUBLIC_URL=http://127.0.0.1:8081 encrypt-click:ci
          for i in $(seq 30); do curl -fs http://127.0.0.1:8081/healthz && break; sleep 1; done
          node scripts/smoke-node.mjs http://127.0.0.1:8081 127.0.0.1:3478
      - name: Package the Node build
        id: package
        if: env.ATTEST == 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/provenance"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -cf - dist | gzip -n > "$RUNNER_TEMP/provenance/encrypt-click-node-dist.tar.gz"
          cp dist/client/build-integrity.json "$RUNNER_TEMP/provenance/build-integrity.json"
          echo "image=$(docker image inspect encrypt-click:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.ATTEST == 'true'
        with:
          subject-path: |
            ${{ runner.temp }}/provenance/encrypt-click-node-dist.tar.gz
            ${{ runner.temp }}/provenance/build-integrity.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.ATTEST == 'true'
        with:
          subject-name: encrypt-click
          subject-digest: ${{ steps.package.outputs.image }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.ATTEST == 'true'
        with:
          name: build-integrity-node
          path: ${{ runner.temp }}/provenance/build-integrity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.ATTEST == 'true'
        with:
          name: encrypt-click-node-dist
          path: ${{ runner.temp }}/provenance/encrypt-click-node-dist.tar.gz
          if-no-files-found: error
      - if: failure()
        run: docker logs encrypt || true
