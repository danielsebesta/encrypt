name = "encrypt-click"
main = "src/worker.ts"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "encrypt.click", custom_domain = true },
  { pattern = "www.encrypt.click", custom_domain = true }
]

logpush = false

# No request logs or traces: URLs can carry encrypted payloads and the service promises not to keep logs.
[observability]
enabled = false
redact_query_string = true

# HTML pages pass through the worker so locale redirects can run. Fingerprinted assets under /_astro and /fonts
# stay on the asset path.
[assets]
run_worker_first = [
  "/", "/share", "/share/", "/u", "/u/", "/chat", "/chat/", "/whiteboard", "/whiteboard/",
  "/security", "/security/", "/privacy", "/privacy/", "/preview", "/preview/", "/tools/*",
  "/_lang/*",
  "/cs", "/cs/*", "/de", "/de/*", "/es", "/es/*", "/fr", "/fr/*", "/sk", "/sk/*", "/pl", "/pl/*",
]

[vars]
SHORTENER_URL = "https://l.encrypt.click/api/shorten"
R2_ACCOUNT_ID = "c76ce085303f62a966fac128aa2952ae"
R2_JURISDICTION = "eu"
R2_BUCKET_NAME = "encrypt-r2"

# Uploaded ciphertext, served same-origin from /dl/<id>, under t1h/, t1d/ and t7d/; one lifecycle rule per prefix deletes it.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "encrypt-r2"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "SECURITY_BUDGET"
class_name = "SecurityBudget"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatServer"

[[durable_objects.bindings]]
name = "WHITEBOARD"
class_name = "WhiteboardServer"

[[migrations]]
tag = "security-v1"
new_sqlite_classes = ["SecurityBudget"]

[[migrations]]
tag = "realtime-v1"
new_sqlite_classes = ["ChatServer", "WhiteboardServer"]

# The saved-room classes are gone. To purge their leftover Durable Object storage on production,
# ship one deploy with a `deleted_classes = ["PersistentChatServer", "SavedWhiteboardServer"]`
# migration re-added here — wrangler dev cannot apply it locally, so it is left out.
