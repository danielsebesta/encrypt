name = "encrypt-click"
main = "src/worker.ts"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "encrypt.click", custom_domain = true },
  { pattern = "www.encrypt.click", custom_domain = true }
]

logpush = false

# No request logs or traces: URLs can carry encrypted payloads and the service promises not to keep logs.
[observability]
enabled = false
redact_query_string = true

# HTML pages pass through the worker so locale redirects and a per-request CSP nonce for Cloudflare's
# bot-detection inject can run. Fingerprinted assets under /_astro and /fonts stay on the asset path.
[assets]
run_worker_first = [
  "/", "/share", "/share/", "/u", "/u/", "/chat", "/chat/", "/whiteboard", "/whiteboard/",
  "/security", "/security/", "/privacy", "/privacy/", "/preview", "/preview/", "/tools/*",
  "/_lang/*",
  "/cs", "/cs/*", "/de", "/de/*", "/es", "/es/*", "/fr", "/fr/*", "/sk", "/sk/*", "/pl", "/pl/*",
]

[vars]
SHORTENER_URL = "https://l.encrypt.click/api/shorten"

# Uploaded ciphertext, served same-origin from /dl/<id>; a lifecycle rule deletes objects after one day.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "encrypt-r2"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "SECURITY_BUDGET"
class_name = "SecurityBudget"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatServer"

[[durable_objects.bindings]]
name = "WHITEBOARD"
class_name = "WhiteboardServer"

[[migrations]]
tag = "security-v1"
new_sqlite_classes = ["SecurityBudget"]

[[migrations]]
tag = "realtime-v1"
new_sqlite_classes = ["ChatServer", "WhiteboardServer"]

[[durable_objects.bindings]]
name = "CHAT_PERSISTENT"
class_name = "PersistentChatServer"

[[migrations]]
tag = "persistent-v1"
new_sqlite_classes = ["PersistentChatServer"]
