name = "encrypt-click"
main = "src/worker.ts"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "encrypt.click", custom_domain = true },
  { pattern = "www.encrypt.click", custom_domain = true }
]

# Unprefixed pages pass through the worker so the language can be chosen server-side; assets and localized pages are served directly.
[assets]
run_worker_first = ["/", "/share", "/share/", "/u", "/u/", "/chat", "/chat/", "/whiteboard", "/whiteboard/", "/security", "/security/", "/privacy", "/privacy/", "/preview", "/preview/", "/tools/*", "/_lang/*"]

[[durable_objects.bindings]]
name = "SECURITY_BUDGET"
class_name = "SecurityBudget"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatServer"

[[durable_objects.bindings]]
name = "WHITEBOARD"
class_name = "WhiteboardServer"

[[migrations]]
tag = "security-v1"
new_sqlite_classes = ["SecurityBudget"]

[[migrations]]
tag = "realtime-v1"
new_sqlite_classes = ["ChatServer", "WhiteboardServer"]
