name = "encrypt-click"
main = "src/worker.ts"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "encrypt.click", custom_domain = true },
  { pattern = "www.encrypt.click", custom_domain = true }
]

logpush = false

# No request logs or traces: URLs can carry encrypted payloads and the service promises not to keep logs.
[observability]
enabled = false
redact_query_string = true

# Unprefixed pages pass through the worker so the language can be chosen server-side; assets and localized pages are served directly.
# /models/* is Chat cipher language packs from the encrypt-models R2 bucket (too large for Worker assets).
[assets]
run_worker_first = ["/", "/share", "/share/", "/u", "/u/", "/chat", "/chat/", "/whiteboard", "/whiteboard/", "/security", "/security/", "/privacy", "/privacy/", "/preview", "/preview/", "/tools/*", "/_lang/*", "/models/*"]

[vars]
SHORTENER_URL = "https://l.encrypt.click/api/shorten"

# Uploaded ciphertext, served same-origin from /dl/<id>; a lifecycle rule deletes objects after one day.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "encrypt-r2"
jurisdiction = "eu"

# Chat cipher ONNX packs + ORT WASM (prepared by scripts/prepare-chat-cipher-models.mjs).
[[r2_buckets]]
binding = "MODELS"
bucket_name = "encrypt-models"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "SECURITY_BUDGET"
class_name = "SecurityBudget"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatServer"

[[durable_objects.bindings]]
name = "WHITEBOARD"
class_name = "WhiteboardServer"

[[migrations]]
tag = "security-v1"
new_sqlite_classes = ["SecurityBudget"]

[[migrations]]
tag = "realtime-v1"
new_sqlite_classes = ["ChatServer", "WhiteboardServer"]

[[durable_objects.bindings]]
name = "CHAT_PERSISTENT"
class_name = "PersistentChatServer"

[[migrations]]
tag = "persistent-v1"
new_sqlite_classes = ["PersistentChatServer"]
