# A fresh install that the Deploy to Cloudflare button can provision. encrypt.click itself deploys with
# wrangler.production.json on top: its domains, worker name, EU bucket and its full migration history.
name = "encrypt"
main = "src/worker.ts"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

logpush = false

# No request logs or traces: URLs can carry encrypted payloads and the service promises not to keep logs.
[observability]
enabled = false
redact_query_string = true

# HTML pages pass through the worker so the language of the visitor's settings can be applied. Fingerprinted assets under /_astro and /fonts
# stay on the asset path.
[assets]
run_worker_first = [
  "/", "/share", "/share/", "/u", "/u/", "/chat", "/chat/", "/whiteboard", "/whiteboard/",
  "/security", "/security/", "/privacy", "/privacy/", "/preview", "/preview/", "/tools/*", "/experiments/*",
  "/install", "/install/", "/licenses", "/licenses/", "/app", "/app/", "/decrypt", "/decrypt/",
  "/_lang/*",
  "/cs", "/cs/*", "/de", "/de/*", "/es", "/es/*", "/fr", "/fr/*", "/sk", "/sk/*", "/pl", "/pl/*",
]

# Expired uploads are deleted by the hourly sweep in src/worker.ts, so a bucket without lifecycle rules stays clean.
[triggers]
crons = ["17 * * * *"]

# Uploaded ciphertext, served same-origin from /dl/<id>, under t1h/, t1d/ and t7d/.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "encrypt-uploads"

[[durable_objects.bindings]]
name = "SECURITY_BUDGET"
class_name = "SecurityBudget"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatServer"

[[durable_objects.bindings]]
name = "WHITEBOARD"
class_name = "WhiteboardServer"

[[migrations]]
tag = "security-v1"
new_sqlite_classes = ["SecurityBudget"]

[[migrations]]
tag = "realtime-v1"
new_sqlite_classes = ["ChatServer", "WhiteboardServer"]
