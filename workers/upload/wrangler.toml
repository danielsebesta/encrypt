name = "encrypt-uploader"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = false
routes = [{ pattern = "upload.encrypt.click/*", zone_name = "encrypt.click" }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "encrypt-r2"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "UploadBudget"

[[migrations]]
tag = "budget-v1"
new_sqlite_classes = ["UploadBudget"]
